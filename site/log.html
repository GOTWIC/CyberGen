<!doctype html>
<!-- The build log page's template: site/build.py fills in the double-brace tokens from site/gallery.json. Edit entries there, not here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0c10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230a0c10'/%3E%3Cpath d='M7 25V13h4v12zm7 0V7h4v18zm7 0V16h4v9z' fill='%2300d4ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-filter="all" data-page="log">
<div class="backdrop" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="./"><b>CyberGen</b></a>
  <nav class="tabs" aria-label="Pages">
    <a class="btn" href="./">Showcase</a>
    <a class="btn on" href="log.html" aria-current="page"><span class="wide-only">Build </span>log</a>
  </nav>
  <nav class="filters" aria-label="Show a stage">
    <button class="btn on" type="button" data-filter="all" aria-pressed="true">All</button>{{FILTERS}}
  </nav>
  <div class="spacer"></div>
  <a class="btn gh" href="{{REPO}}">GitHub</a>
</header>

<div class="shell">
  <aside class="rail" aria-label="Contents">
{{RAIL}}
  </aside>

  <main id="top">
    <section class="hero glass">
      <div class="lbl kicker"><span class="dot"></span>{{KICKER}}</div>
      <h1>Build log</h1>
      <dl class="stats">{{STATS}}</dl>
      <div class="strip" aria-label="Pictures by day">
        <div class="lbl">Pictures by day</div>
        {{STRIP}}
      </div>
    </section>
{{STAGES}}

    <footer class="foot">
      <p>{{NEXT}}</p>
      <p class="mono">CyberGen · <a href="{{REPO}}">source on GitHub</a> · page built {{BUILT}}</p>
    </footer>
  </main>
</div>

<dialog id="lb" aria-label="Image viewer">
  <div class="lb-bar">
    <span class="lb-tags"></span>
    <span class="spacer"></span>
    <span class="lb-count mono"></span>
    <button class="btn" type="button" data-lb="prev" aria-label="Previous picture">Prev</button>
    <button class="btn" type="button" data-lb="next" aria-label="Next picture">Next</button>
    <button class="btn" type="button" data-lb="close" aria-label="Close">Close</button>
  </div>
  <figure class="lb-fig">
    <div class="lb-img"><img alt=""></div>
    <figcaption>
      <h3></h3>
      <p></p>
      <a class="lb-src mono" target="_blank" rel="noopener">Original image on GitHub</a>
    </figcaption>
  </figure>
</dialog>

<script src="app.js" defer></script>
</body>
</html>
